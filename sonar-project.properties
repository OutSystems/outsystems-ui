# SonarCloud connection settings
sonar.host.url=https://sonarcloud.io
sonar.organization=outsystemsrd

# Required: Unique project key (usually org_repo format)
sonar.projectKey=OutSystems_outsystems-ui

# Project name displayed in SonarCloud
sonar.projectName=OutSystems UI

# Source code location
sonar.sources=src

# Exclude files from analysis (optional)
#
# NOTE: this file is read by the CI scanner only (`.github/actions/run-sonarcloud`,
# currently disabled in build.yaml). SonarCloud's Automatic Analysis — the scan
# that comments on pull requests — ignores it and reads `.sonarcloud.properties`
# instead, so a generated file must be excluded in BOTH places.
sonar.exclusions = **/node_modules/**,**/dist/**,**/*.min.js, **/*.spec.ts, **/*.spec.tsx, **/*.stories.tsx, **/*.stories.ts, src/scripts/Utilities/**, **/*DesignTime*, **/*.data.js, **/css-api-manifest.ts, **/migration-data.ts, gulp/ProjectSpecs/ScssStructure/UsefullClasses.js
sonar.test.exclusions = **/*.spec.ts, **/*.spec.tsx, **/*.stories.tsx, **/*.stories.ts, **/*DesignTime*, **/*.data.js

# JavaScript/TypeScript settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
