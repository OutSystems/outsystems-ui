# SonarCloud connection settings
sonar.host.url=https://sonarcloud.io
sonar.organization=outsystemsrd

# Required: Unique project key (usually org_repo format)
sonar.projectKey=OutSystems_outsystems-ui

# Project name displayed in SonarCloud
sonar.projectName=OutSystems UI

# Source code location
sonar.sources=src

# Exclude files from analysis (optional)
#
# NOTE on gulp/**: `sonar.sources` above is `src`, so nothing under gulp/ is analysed
# by a CI scan in the first place. The gulp entry below is listed for SonarCloud's
# Automatic Analysis, which scans the whole repository and honours this file's
# exclusions rather than sonar.sources.
sonar.exclusions = **/node_modules/**,**/dist/**,**/*.min.js, **/*.spec.ts, **/*.spec.tsx, **/*.stories.tsx, **/*.stories.ts, src/scripts/Utilities/**, **/*DesignTime*, **/*.data.js, gulp/ProjectSpecs/ScssStructure/UsefullClasses.js
sonar.test.exclusions = **/*.spec.ts, **/*.spec.tsx, **/*.stories.tsx, **/*.stories.ts, **/*DesignTime*, **/*.data.js

# JavaScript/TypeScript settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
