name: Chromatic

# Publishes the Storybook to Chromatic for visual review.
on:
    pull_request:
        branches: ['dev']
        types: [opened, reopened, synchronize]
    workflow_dispatch: {}

concurrency:
    group: chromatic-${{ github.ref }}
    cancel-in-progress: true

permissions:
    id-token: write # required for the Azure OIDC login below
    contents: read

jobs:
    chromatic:
        name: Publish Storybook to Chromatic
        runs-on: ubuntu-latest
        steps:
            - name: 📥 Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  # Chromatic needs the full git history to track baselines / TurboSnap.
                  fetch-depth: 0

            - name: ⬢ Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 20

            - name: 🔐 Azure login
              uses: ./.github/actions/az-login
              with:
                  client-id: ${{ secrets.OSUI_AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.OSUI_AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.OSUI_AZURE_SUBSCRIPTION_ID }}

            # The platform-widget devDeps (@outsystems/runtime-*-js) live on the internal
            # Azure Artifacts feed. Mint a feed token from the OIDC-logged-in identity and
            # add it to .npmrc so `npm install` can resolve the @outsystems scope.
            # NOTE: verify the OIDC identity has read access to the ArtifactRepository feed;
            # otherwise swap this for an az-keyvault-get of a feed PAT.
            - name: 🔑 Authenticate npm to the @outsystems Azure Artifacts feed
              run: |
                  TOKEN=$(az account get-access-token \
                    --resource 499b84ac-1321-427f-aa17-267ca6975798 \
                    --query accessToken -o tsv)
                  FEED=//pkgs.dev.azure.com/OutSystemsRD/_packaging/ArtifactRepository/npm
                  {
                    echo "${FEED}/registry/:_authToken=${TOKEN}"
                    echo "${FEED}/:_authToken=${TOKEN}"
                  } >> .npmrc

            - name: 🕸️ Install dependencies
              run: npm install

            - name: 🏗️ Build the OUI bundle
              # Storybook serves dist/ODC.OutSystemsUI.{js,css} via staticDirs, so the
              # bundle must exist before build-storybook runs (Chromatic runs that).
              run: npm run build:osui

            - name: 🎨 Publish to Chromatic
              run: npm run chromatic
              env:
                  CHROMATIC_PROJECT_TOKEN: ${{ secrets.OSUI_CHROMATIC_TOKEN }}
