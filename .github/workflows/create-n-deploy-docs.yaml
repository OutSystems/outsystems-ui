name: Create and Deploy Docs

# Run this workflow from dev (the Azure federated credential only accepts that ref)
# and pass the release tag whose documentation should be published.
on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag to generate the documentation from (e.g. v3.0.0). Its package.json version must match.'
                type: string
                required: true
            run-lint:
                description: 'Compile and perform lint tests to ensure there is no issues at the given tag.'
                type: boolean
                default: true

permissions:
    contents: read

jobs:
    check-repo:
        runs-on: ubuntu-latest

        outputs:
            is-real-osui-repo: ${{ steps.check-is-real-osui-repo.outputs.isIt }}

        steps:
            - name: 🔎 Check if it's outsystems-ui real repository
              id: check-is-real-osui-repo
              run: |
                  echo "isIt=${{ github.event.repository.name == 'outsystems-ui' }}" >> "$GITHUB_OUTPUT"

    validate-tag:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: 🏷️ Check the tag format
              env:
                  TAG: ${{ inputs.tag }}
              run: |
                  if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::'$TAG' is not a release tag. Expected vX.Y.Z (e.g. v3.0.0)."
                      exit 1
                  fi

            - name: 📥 Checkout tag ${{ inputs.tag }}
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: refs/tags/${{ inputs.tag }}

            - name: 🔢 Check the tag matches the package version
              env:
                  TAG: ${{ inputs.tag }}
              run: |
                  packageVersion=$(node -p "require('./package.json').version")
                  if [[ "v$packageVersion" != "$TAG" ]]; then
                      echo "::error::Tag $TAG has package.json version $packageVersion. They must match."
                      exit 1
                  fi

    run-lint:
        needs: validate-tag
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: 📥 Checkout tag ${{ inputs.tag }}
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: refs/tags/${{ inputs.tag }}

            - name: 📦 Setup Node
              uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
              with:
                  node-version: 24

            - name: 🕸️ Install project dependencies
              if: ${{ inputs.run-lint == true }}
              run: npm install

            - name: 🏗️ Run build
              if: ${{ inputs.run-lint == true }}
              run: npm run build

    # Generates the docs from the tag and replaces the content of the docs site repository in one go.
    # No intermediate branch: docs/ is gitignored here, so it can't be committed to this repository anyway.
    publish-docs:
        needs: [check-repo, run-lint]
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read

        env:
            DOCS_REPOSITORY: outsystems-ui-docs/outsystems-ui-docs.github.io
            SOURCE_DIR: source

        steps:
            # The workflow's own ref (dev) provides the local composite actions.
            - name: 📥 Checkout repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: 📥 Checkout tag ${{ inputs.tag }} into ${{ env.SOURCE_DIR }}
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: refs/tags/${{ inputs.tag }}
                  path: ${{ env.SOURCE_DIR }}

            - name: 📦 Setup Node
              uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
              with:
                  node-version: 24

            - name: 🕸️ Install project dependencies
              working-directory: ${{ env.SOURCE_DIR }}
              run: npm install

            - name: 📦 Install graphviz
              run: sudo apt-get install -y graphviz

            - name: 🏗️ Generate documentation
              working-directory: ${{ env.SOURCE_DIR }}
              run: npm run docs

            - name: 🔐 Azure Login
              if: ${{ needs.check-repo.outputs.is-real-osui-repo == 'true' }}
              uses: ./.github/actions/az-login
              with:
                  client-id: ${{ secrets.OSUI_AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.OSUI_AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.OSUI_AZURE_SUBSCRIPTION_ID }}

            - name: 🔑 Get GitHub Token from Azure Key Vault
              if: ${{ needs.check-repo.outputs.is-real-osui-repo == 'true' }}
              id: get-github-token
              uses: ./.github/actions/az-keyvault-get
              with:
                  key-name: o11odc-github-gitpersonal-token-prd

            - name: 📤 Publish documentation to the docs site
              if: ${{ needs.check-repo.outputs.is-real-osui-repo == 'true' }}
              env:
                  GITHUB_TOKEN_FOR_DOCS: ${{ steps.get-github-token.outputs.az-keyvault-value }}
                  TAG: ${{ inputs.tag }}
              run: |
                  set -euo pipefail

                  siteDir="$RUNNER_TEMP/docs-site"
                  sourceCommit=$(git -C "$SOURCE_DIR" rev-parse --short HEAD)

                  git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN_FOR_DOCS}@github.com/${DOCS_REPOSITORY}.git" "$siteDir"

                  # Replace the whole site, so pages that no longer exist in the API are removed too.
                  # .github (the Pages deploy workflow) and LICENSE belong to the docs repository itself.
                  find "$siteDir" -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name LICENSE -exec rm -rf {} +
                  # "docs/." (not "docs/*") so dotfiles such as .nojekyll are copied too.
                  cp -a "$SOURCE_DIR/docs/." "$siteDir/"

                  cd "$siteDir"
                  git config user.email "sa_git_uicomponents@outsystems.com"
                  git config user.name "UiComponentsBot"
                  git add --all

                  if git diff --cached --quiet; then
                      echo "The docs site already matches $TAG. Nothing to publish."
                      exit 0
                  fi

                  git commit -m "Deploy documentation $TAG (outsystems-ui $sourceCommit)"
                  git push origin HEAD:main
