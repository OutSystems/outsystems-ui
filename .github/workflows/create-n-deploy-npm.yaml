# Create and Deploy NPM
#
# Publishes a released version of outsystems-ui to npm, with provenance (npm trusted publishing).
#
# How to run: Actions > Create and Deploy NPM > Run workflow, keep "Use workflow from" = dev
# (the Azure federated credential only accepts that ref) and enter the release tag, e.g. v3.0.0.
# Keep this file name: npm trusted publishing is bound to it.
#
# Flow:
#   validate-tag    vX.Y.Z format, published non-prerelease GitHub release, matches package.json
#   run-lint        optional build of the tag, to catch compile and lint errors before publishing
#   create-branch   creates the temporary deploy-npm branch from the tag
#   prepare-branch  builds, removes development files, limits the package to dist and src, commits to deploy-npm
#   publish-npm     publishes deploy-npm to npm
#   delete-branch   removes deploy-npm, also after a failure
#
# Decisions: docs-internal/adr/ADR-0023-release-workflows-publish-a-validated-tag.md
name: Create and Deploy NPM

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag to publish (e.g. v3.0.0). Its package.json version must match.'
                type: string
                required: true
            delete-branch:
                description: 'Delete deploy-npm branch at the end of process.'
                type: boolean
                default: true
            run-lint:
                description: 'Compile and perform lint tests to ensure there is no issues at the given tag.'
                type: boolean
                default: true
    
permissions:
    contents: read

# One run at a time: parallel runs share the deploy-npm branch, and a failed run deletes it.
concurrency:
    group: deploy-npm
    cancel-in-progress: false

jobs:
    # Forks can run the workflow but never publish.
    check-repo:
        runs-on: ubuntu-latest

        outputs:
            is-real-osui-repo: ${{ steps.check-is-real-osui-repo.outputs.isIt }}

        steps:
            - name: 🔎 Check if it's outsystems-ui real repository
              id: check-is-real-osui-repo
              run: |
                  echo "isIt=${{ github.event.repository.name == 'outsystems-ui' }}" >> "$GITHUB_OUTPUT"

    # Stops the run before anything is built or published.
    validate-tag:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        outputs:
            commit: ${{ steps.validated-commit.outputs.sha }}

        steps:
            - name: 🏷️ Check the tag format
              env:
                  TAG: ${{ inputs.tag }}
              run: |
                  if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::'$TAG' is not a release tag. Expected vX.Y.Z (e.g. v3.0.0)."
                      exit 1
                  fi

            - name: 🚀 Check the tag is a published release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ inputs.tag }}
              run: |
                  # Release candidates get a vX.Y.Z tag too, but their GitHub release is a prerelease.
                  if ! releaseJson=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease,isDraft); then
                      echo "::error::Tag $TAG has no GitHub release. Only published releases can be deployed."
                      exit 1
                  fi

                  isPrerelease=$(jq -r '.isPrerelease' <<< "$releaseJson")
                  isDraft=$(jq -r '.isDraft' <<< "$releaseJson")
                  if [[ "$isPrerelease" == "true" || "$isDraft" == "true" ]]; then
                      echo "::error::Release $TAG is not a published final release (prerelease=$isPrerelease, draft=$isDraft)."
                      exit 1
                  fi

            - name: 📥 Checkout tag ${{ inputs.tag }}
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: refs/tags/${{ inputs.tag }}

            - name: 🔢 Check the tag matches the package version
              env:
                  TAG: ${{ inputs.tag }}
              run: |
                  packageVersion=$(node -p "require('./package.json').version")
                  if [[ "v$packageVersion" != "$TAG" ]]; then
                      echo "::error::Tag $TAG has package.json version $packageVersion. They must match."
                      exit 1
                  fi

            # Later jobs check out the tag again and stop unless it still points to this commit:
            # a release-candidate rerun deletes and recreates tags.
            - name: 📌 Record the validated commit
              id: validated-commit
              run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # Builds the tag only when the run-lint input is true.
    run-lint:
        needs: validate-tag
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: 📥 Checkout tag ${{ inputs.tag }}
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: refs/tags/${{ inputs.tag }}

            # Repeated in each job that checks out the tag: a composite action can't be used there,
            # because older tags don't have it.
            - name: 📌 Check the tag still points to the validated commit
              env:
                  TAG: ${{ inputs.tag }}
                  VALIDATED_COMMIT: ${{ needs.validate-tag.outputs.commit }}
              run: |
                  # A release-candidate rerun deletes and recreates tags; stop if the tag moved after validate-tag.
                  currentCommit=$(git rev-parse HEAD)
                  if [[ "$currentCommit" != "$VALIDATED_COMMIT" ]]; then
                      echo "::error::Tag $TAG moved after validation ($VALIDATED_COMMIT -> $currentCommit)."
                      exit 1
                  fi

            - name: 📦 Setup Node
              uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
              with:
                  node-version: 24

            # Repeated in each job that checks out the tag: a composite action can't be used there,
            # because older tags don't have it.
            - name: ⬆️ Match the npm the tag pins
              # Only npm >= 11.17 understands .npmrc's min-release-age-exclude[]; the tag's volta block pins the npm to use.
              run: |
                  pinnedNpmVersion=$(node -p "require('./package.json').volta?.npm ?? ''")
                  if [[ -z "$pinnedNpmVersion" ]]; then
                      echo "The tag pins no npm version. Keeping the npm bundled with Node."
                      exit 0
                  fi
                  npm install -g "npm@$pinnedNpmVersion" --ignore-scripts

            - name: 🕸️ Install project dependencies
              if: ${{ inputs.run-lint == true }}
              run: |
                  npm install

            - name: 🏗️ Run build
              if: ${{ inputs.run-lint == true }}
              run: |
                  npm run build

    # Temporary branch: prepare-branch commits the build output to it and publish-npm publishes from it.
    create-branch:
        needs: [validate-tag, run-lint]
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: write

        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: 🔐 Azure Login
              uses: ./.github/actions/az-login
              with:
                client-id: ${{ secrets.OSUI_AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.OSUI_AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.OSUI_AZURE_SUBSCRIPTION_ID }}

            - name: 🔑 Get GitHub Token from Azure Key Vault
              id: get-github-token
              uses: ./.github/actions/az-keyvault-get
              with:
                  key-name: o11odc-github-gitpersonal-token-prd

            - name: 📥 Checkout tag ${{ inputs.tag }}
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: refs/tags/${{ inputs.tag }}
                  token: ${{ steps.get-github-token.outputs.az-keyvault-value }}

            - name: 📌 Check the tag still points to the validated commit
              env:
                  TAG: ${{ inputs.tag }}
                  VALIDATED_COMMIT: ${{ needs.validate-tag.outputs.commit }}
              run: |
                  # A release-candidate rerun deletes and recreates tags; stop if the tag moved after validate-tag.
                  currentCommit=$(git rev-parse HEAD)
                  if [[ "$currentCommit" != "$VALIDATED_COMMIT" ]]; then
                      echo "::error::Tag $TAG moved after validation ($VALIDATED_COMMIT -> $currentCommit)."
                      exit 1
                  fi

            - name: 📦 Create new deploy-npm branch based on ${{ inputs.tag }}
              run: |
                  git checkout -b deploy-npm
                  git push -u origin deploy-npm

    # Turns deploy-npm into the package content: build output committed, development files removed.
    prepare-branch:
        needs: create-branch
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: write

        steps:
            # Using remote azure/login action directly to avoid post-action failure
            # when gulp prepareToDeploy removes the .github folder
            - name: 🔐 Azure Login
              uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0 # v2.3.0
              with:
                client-id: ${{ secrets.OSUI_AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.OSUI_AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.OSUI_AZURE_SUBSCRIPTION_ID }}

            # Using remote azure/cli action directly to avoid post-action failure
            # when gulp prepareToDeploy removes the .github folder
            - name: 🔑 Get GitHub Token from Azure Key Vault
              id: get-github-token
              uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
              with:
                  inlineScript: |
                      secretValue=$(az keyvault secret show --name "o11odc-github-gitpersonal-token-prd" --vault-name "kv-ui-components" --query "value" --output tsv)
                      echo "::add-mask::$secretValue"
                      echo "az-keyvault-value=$secretValue" >> $GITHUB_OUTPUT

            - name: 🔧 Configure Git with the UiComponentsBot Token
              run: |
                  git config --global user.email "sa_git_uicomponents@outsystems.com"
                  git config --global user.name "UiComponentsBot"

            - name: 📥 Checkout into deploy-npm
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: deploy-npm
                  token: ${{ steps.get-github-token.outputs.az-keyvault-value }}

            - name: 📦 Setup Node
              uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
              with:
                  node-version: 24

            - name: ⬆️ Match the npm the tag pins
              # Only npm >= 11.17 understands .npmrc's min-release-age-exclude[]; the tag's volta block pins the npm to use.
              run: |
                  pinnedNpmVersion=$(node -p "require('./package.json').volta?.npm ?? ''")
                  if [[ -z "$pinnedNpmVersion" ]]; then
                      echo "The tag pins no npm version. Keeping the npm bundled with Node."
                      exit 0
                  fi
                  npm install -g "npm@$pinnedNpmVersion" --ignore-scripts

            - name: 🕸️ Install project dependencies
              run: |
                  npm install

            - name: 🗑️ Remove dist folder from .gitignore
              run: |
                  # Local binary on purpose: runner images no longer install gulp globally (ubuntu-26.04), and
                  # npx could download an unverified gulp release from the registry (flagged by SonarCloud).
                  ./node_modules/.bin/gulp removeDistFromGitIgnore

            - name: 🏗️ Compile into production mode
              run: |
                  npm run build

            - name: 🧹 Clean files and folders
              run: |
                  # Local binary on purpose: runner images no longer install gulp globally (ubuntu-26.04), and
                  # npx could download an unverified gulp release from the registry (flagged by SonarCloud).
                  ./node_modules/.bin/gulp prepareToDeploy

            # Whitelist the package content here, not in package.json, so it also applies to tags
            # created before this rule existed. The prepareToDeploy remove list alone misses new folders.
            - name: 📋 Limit the package to dist and src
              run: |
                  npm pkg set 'files[]=dist' 'files[]=src'

            # dist is committed so publish-npm, a fresh job, gets the build. .gitignore is removed because npm
            # would otherwise use it to exclude files. Kept as is: the files whitelist now decides the content.
            - name: 📤 Commit, remove gitignore and commit again!
              run: |
                  git add .
                  git commit -m 'OK to Deploy into NPM. [skip ci]'
                  git push origin deploy-npm

                  rm .gitignore

                  git add .
                  git commit -m 'OK to Deploy into NPM. [skip ci]'
                  git push origin deploy-npm

    # Publishes deploy-npm with provenance; the publish step is skipped on forks.
    publish-npm:
        needs: [check-repo, prepare-branch]
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: write

        steps:
            # Using remote azure/login action directly to avoid post-action failure
            # when gulp prepareToDeploy removes the .github folder
            - name: 🔐 Azure Login
              uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0 # v2.3.0
              with:
                client-id: ${{ secrets.OSUI_AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.OSUI_AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.OSUI_AZURE_SUBSCRIPTION_ID }}

            # Using remote azure/cli action directly to avoid post-action failure
            # when gulp prepareToDeploy removes the .github folder
            - name: 🔑 Get GitHub Token from Azure Key Vault
              id: get-github-token
              uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
              with:
                  inlineScript: |
                      secretValue=$(az keyvault secret show --name "o11odc-github-gitpersonal-token-prd" --vault-name "kv-ui-components" --query "value" --output tsv)
                      echo "::add-mask::$secretValue"
                      echo "az-keyvault-value=$secretValue" >> $GITHUB_OUTPUT

            - name: 📥 Checkout into deploy-npm
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: deploy-npm
                  token: ${{ steps.get-github-token.outputs.az-keyvault-value }}

            - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
              name: 📦 Setup Node
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org/

            # npm trusted publishing (OIDC) needs a recent npm.
            - name: 🔄 Ensure Latest npm
              run: npm install -g npm@latest
              shell: bash
              
            - name: 📋 List package content
              run: npm pack --dry-run

            - name: 🚀 Publish new version to NPM
              if: ${{ needs.check-repo.outputs.is-real-osui-repo == 'true' }}
              run: npm publish --provenance

    # Runs after failures too, so a leftover deploy-npm branch doesn't block the next run.
    delete-branch:
        needs: [create-branch, publish-npm]
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: write

        if: ${{ always() && inputs.delete-branch == true && needs.create-branch.result == 'success' }}
        steps:
            - name: 📥 Checkout branch dev
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: dev

            - name: 🗑️ Delete branch deploy-npm
              shell: bash
              run: |
                  git push origin -d deploy-npm
