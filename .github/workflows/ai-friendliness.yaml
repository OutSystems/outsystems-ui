name: AI-friendliness gate

# Two checks that keep the library legible to coding agents and ready for enterprise apps:
#   1. every eval suite of evals/suites.mjs is gated against the newest entry of evals/results/history.json
#      (the newest run recorded on dev once one exists): its index may not drop by more than 1 point, no
#      eval by more than 3, no-decrease evals (R01 coverage) not at all, and no eval may leave more
#      components unmeasured than the baseline; the report also lists components evals/components.json
#      does not classify yet;
#   2. docs-ai/ (component manifest + llms.txt tiers) must match a fresh generation from the source.
# Runs on pull requests into dev and on demand for any branch (Actions → AI-friendliness gate →
# Run workflow), so the checks can be exercised on a draft PR or a feature branch. Locally:
#   npm run evals:gate && npm run docs:ai:check
on:
    pull_request:
        branches: ['dev']
        types: [opened, reopened, synchronize]
    workflow_dispatch:
        inputs:
            max-drop:
                description: 'Allowed drop of the AI-Friendliness Index, in points'
                type: string
                default: '1'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write # one sticky "before → after" comment per pull request

jobs:
    gate:
        name: Evals gate and docs-ai freshness
        runs-on: ubuntu-latest
        steps:
            - name: 📥 Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: 📦 Setup Node
              uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
              with:
                  node-version: 24

            # .npmrc carries min-release-age-exclude[], which needs npm >= 11.17 (pinned to the volta version)
            - name: 📦 Ensure npm >= 11.17
              run: npm install -g npm@11.18.0 --ignore-scripts

            # No lockfile is committed in this repository (see .gitignore); .npmrc's min-release-age
            # policy is the supply-chain guard. Lifecycle scripts are not needed by the evals.
            - name: 🕸️ Install project dependencies
              run: npm install --ignore-scripts

            - name: 🎨 Generate design tokens (the SCSS evals compile against them)
              run: npm run build:tokens

            - name: 🧪 Unit tests (suite + generator)
              run: npm test

            # Both checks keep going on failure so the report below is always posted; the last
            # step turns their outcomes into the job result.
            - name: 📊 AI-Friendliness Index must not regress
              id: gate
              continue-on-error: true
              run: |
                  node evals/tools/gate.mjs --max-drop "${{ inputs.max-drop || '1' }}" --report gate-report.md
                  cat gate-report.md >> "$GITHUB_STEP_SUMMARY"

            - name: 📄 docs-ai/ must be fresh
              id: docs
              continue-on-error: true
              run: npm run docs:ai:check

            - name: 🔎 Find previous evals comment
              if: github.event_name == 'pull_request'
              id: find_evals_comment
              uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3.1.0
              with:
                  issue-number: ${{ github.event.pull_request.number }}
                  comment-author: 'github-actions[bot]'
                  body-includes: <!-- ai-friendliness-gate-comment -->

            - name: 💬 Post the before → after report on the PR
              if: github.event_name == 'pull_request'
              uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
              env:
                  DOCS_OUTCOME: ${{ steps.docs.outcome }}
                  EXISTING_COMMENT_ID: ${{ steps.find_evals_comment.outputs.comment-id }}
              with:
                  script: |
                      const fs = require('fs');
                      const report = fs.existsSync('gate-report.md')
                        ? fs.readFileSync('gate-report.md', 'utf8')
                        : '### 📊 AI-Friendliness Index: ❌ **Failed**\n\nThe evals did not produce a report; see the job log.';
                      const docs = process.env.DOCS_OUTCOME === 'success'
                        ? '✅ `docs-ai/` matches a fresh generation from the source.'
                        : '❌ `docs-ai/` is stale — run `npm run docs:ai` and commit the result.';
                      const body = `<!-- ai-friendliness-gate-comment -->\n${report}\n\n${docs}\n`;
                      const params = { owner: context.repo.owner, repo: context.repo.repo, body };
                      const existing = process.env.EXISTING_COMMENT_ID;
                      if (existing) {
                        await github.rest.issues.updateComment({ ...params, comment_id: Number(existing) });
                      } else {
                        await github.rest.issues.createComment({ ...params, issue_number: context.issue.number });
                      }

            - name: 🚦 Job result
              if: steps.gate.outcome != 'success' || steps.docs.outcome != 'success'
              run: |
                  echo "::error::AI-Friendliness gate: ${{ steps.gate.outcome }}; docs-ai freshness: ${{ steps.docs.outcome }}"
                  exit 1
