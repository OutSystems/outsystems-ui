name: Release

on:
    workflow_call:
        inputs:
            new-version:
                description: 'Version to be released.'
                type: string
                required: true
            update-prerelease-into-latest:
                description: 'Update pre-release into latest.'
                type: boolean
                default: true
        secrets:
            OSUI_AZURE_CLIENT_ID:
                description: 'Azure Client ID for authentication'
                required: true
            OSUI_AZURE_TENANT_ID:
                description: 'Azure Tenant ID for authentication'
                required: true
            OSUI_AZURE_SUBSCRIPTION_ID:
                description: 'Azure Subscription ID for authentication'
                required: true

jobs:
    run-lint-on-rc:
        name: Run lint on rc branch
        runs-on: ubuntu-latest
        permissions:
            contents: read

        if: ${{ inputs.new-version }}
        steps:
            - name: 📥 Checkout into rc${{ inputs.new-version }}
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: rc${{ inputs.new-version }}

            - name: 📦 Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24

            - name: 🕸️ Install project dependencies
              run: npm install

            - name: 🏗️ Run build
              run: npm run build

    merge-rc-into-main:
        name: Merge rc branch into main
        needs: run-lint-on-rc
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
            pull-requests: write

        if: ${{ inputs.new-version }}
        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: 🔐 Azure login
              #uses: OutSystems/rd.github-reusable-workflows/.github/actions/az-login@9d497d1c5bc6e355aa8f4663539e6b75c212f6b4 #v2.0.7
              uses: ./.github/actions/az-login
              with:
                  client-id: ${{ secrets.OSUI_AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.OSUI_AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.OSUI_AZURE_SUBSCRIPTION_ID }}

            - name: 🔑 Get GitHub Token
              id: get-github-token
              #uses: OutSystems/rd.github-reusable-workflows/.github/actions/az-keyvault-get@9d497d1c5bc6e355aa8f4663539e6b75c212f6b4 #v2.0.7
              uses: ./.github/actions/az-keyvault-get
              with:
                  key-name: o11odc-github-gitpersonal-token-prd

            - name: 🔄 Create release PR for rc${{ inputs.new-version }} into main
              env:
                  GH_TOKEN: ${{ steps.get-github-token.outputs.az-keyvault-value }}
              run: |
                  SOURCE_BRANCH="rc${{ inputs.new-version }}"
                  BASE_BRANCH="main"
                  PR_TITLE="Merge ${SOURCE_BRANCH} into ${BASE_BRANCH} [skip ci]"

                  COMPARE_STATUS=$(gh api \
                    "repos/${{ github.repository }}/compare/${BASE_BRANCH}...${SOURCE_BRANCH}" \
                    --template '{{.status}}')

                  if [ "${COMPARE_STATUS}" = "identical" ] || [ "${COMPARE_STATUS}" = "behind" ]; then
                    echo "${SOURCE_BRANCH} is already merged into ${BASE_BRANCH}."
                    exit 0
                  fi

                  PR_NUMBER=$(gh pr list \
                    --head "${SOURCE_BRANCH}" \
                    --base "${BASE_BRANCH}" \
                    --state open \
                    --limit 1 \
                    --json number \
                    --jq '.[0].number // empty')

                  if [ -z "${PR_NUMBER}" ]; then
                    PR_URL=$(gh pr create \
                      --base "${BASE_BRANCH}" \
                      --head "${SOURCE_BRANCH}" \
                      --title "${PR_TITLE}" \
                      --body "$(printf 'This PR merges %s into %s.\n\nThis PR was automatically created by the Release workflow.\n' "${SOURCE_BRANCH}" "${BASE_BRANCH}")")
                    echo "Release PR: ${PR_URL}"
                  else
                    echo "Release PR: https://github.com/${{ github.repository }}/pull/${PR_NUMBER}"
                  fi

    set-pre-release-as-lts:
        name: Set pre-release as LTS
        needs: merge-rc-into-main
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read

        steps:
            - name: 📥 Checkout into main
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: 🔐 Azure login
              #uses: OutSystems/rd.github-reusable-workflows/.github/actions/az-login@9d497d1c5bc6e355aa8f4663539e6b75c212f6b4 #v2.0.7
              uses: ./.github/actions/az-login
              with:
                  client-id: ${{ secrets.OSUI_AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.OSUI_AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.OSUI_AZURE_SUBSCRIPTION_ID }}

            - name: 🔑 Get GitHub Token
              id: get-github-token
              #uses: OutSystems/rd.github-reusable-workflows/.github/actions/az-keyvault-get@9d497d1c5bc6e355aa8f4663539e6b75c212f6b4 #v2.0.7
              uses: ./.github/actions/az-keyvault-get
              with:
                  key-name: o11odc-github-gitpersonal-token-prd

            - name: 🏷️ Update v${{ inputs.new-version }} Tag Release from pre-release into latest
              if: ${{ inputs.new-version && inputs.update-prerelease-into-latest == true }}
              uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 #v2.2.2
              with:
                  tag_name: v${{ inputs.new-version }}
                  prerelease: false
                  token: ${{ steps.get-github-token.outputs.az-keyvault-value }}
                  make_latest: true
